<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff0f3">
  <meta name="description" content="Anh ở đây để lắng nghe em.">
  <title>Cho anh dỗ em nha? ♡</title>
  <link rel="icon" href="assets/heart.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="page-shell">
    <header class="masthead">
      <a class="wordmark" href="index.html" aria-label="Về trang đầu">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.6 4.8a5.3 5.3 0 0 0-7.5 0L12 5.9l-1.1-1.1a5.3 5.3 0 0 0-7.5 7.5L12 21l8.6-8.7a5.3 5.3 0 0 0 0-7.5Z"/></svg>
        một chút yêu thương
      </a>
      <span class="header-note">chỉ dành cho em</span>
    </header>

    <main class="main-content">
      <div class="letter-wrap">
        <span class="doodle doodle-heart" aria-hidden="true">♡</span>
        <span class="doodle doodle-sparkle" aria-hidden="true">✧</span>
        <article class="letter second-letter" aria-labelledby="second-title">
          <div class="letter-topline">
            <span class="tiny-heart" aria-hidden="true">♥</span>
            <span>MỘT LỜI NHẮN CHO EM</span>
            <span class="tiny-heart" aria-hidden="true">♥</span>
          </div>
          <div class="illustration">
            <img src="assets/love-cats.png" alt="Hai chú mèo dễ thương cùng một trái tim hồng." width="1536" height="1024">
            <span class="art-note" aria-hidden="true">thương em nhiều… ♡</span>
          </div>
          <p class="eyebrow">Ừm, anh nghe em mà.</p>
          <h1 id="second-title">Cho anh dỗ em nha?</h1>
          <!-- You can change this message for your girlfriend. -->
          <p class="love-note">Nếu anh làm em buồn, anh xin lỗi nhé.<br>Em cứ nói, anh ở đây để lắng nghe em.</p>
          <div class="second-actions">
            <button class="button button-pink" id="hug-button" type="button">Nhận một cái ôm <span aria-hidden="true">♡</span></button>
            <p class="hug-message" id="hug-message" role="status" aria-live="polite"></p>
            <a class="back-link" href="index.html"><span aria-hidden="true">←</span> Quay lại câu hỏi nhỏ</a>
          </div>
        </article>
        <p class="under-letter"><span aria-hidden="true">✦</span> em cứ là em, anh vẫn thương <span aria-hidden="true">✦</span></p>
      </div>
    </main>

    <footer class="page-footer">Làm bằng cả trái tim <span aria-hidden="true">♡</span></footer>
  </div>
</body>
</html>
