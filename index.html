<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff0f3">
  <meta name="description" content="Một câu hỏi nhỏ, gửi người anh thương.">
  <title>Em giận anh hả ? ♡</title>
  <link rel="icon" href="assets/heart.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="page-shell">
    <header class="masthead">
      <a class="wordmark" href="index.html" aria-label="Về trang đầu">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.6 4.8a5.3 5.3 0 0 0-7.5 0L12 5.9l-1.1-1.1a5.3 5.3 0 0 0-7.5 7.5L12 21l8.6-8.7a5.3 5.3 0 0 0 0-7.5Z"/></svg>
        một chút yêu thương
      </a>
    </header>

    <main class="main-content">
      <div class="letter-wrap">
        <span class="doodle doodle-heart" aria-hidden="true">♡</span>
        <span class="doodle doodle-sparkle" aria-hidden="true">✧</span>
        <article class="letter" aria-labelledby="question">
          <div class="illustration">
            <img src="assets/love-cats.png" alt="Mèo trắng ngại ngùng tặng trái tim cho mèo hồng đang giả vờ giận." width="1536" height="1024" fetchpriority="high">
            <span class="art-note" aria-hidden="true">đừng giận mà… ♡</span>
          </div>

          <h1 id="question">Em giận anh hả ?</h1>

          <div class="button-playground" id="playground">
            <button class="button button-shy" id="runaway-button" type="button" aria-describedby="runaway-hint">Em không giận anh</button>
            <a class="button button-pink" id="next-page" href="page2.html">Em giận anh đó <span aria-hidden="true">♡</span></a>
          </div>
          <p class="playful-hint" id="runaway-hint" role="status" aria-live="polite" aria-atomic="true">Psst… có một nút hơi nhút nhát đó <span aria-hidden="true">☺</span></p>
        </article>
      </div>
    </main>

  </div>
</body>
</html>
